# Work the app does on a timer. Each job calls a route under /api/cron/ with
# the scheduler's secret; the route does the work (see src/lib/ops/cron.ts).
#
# ACCOUNT DELETIONS (src/lib/account-deletion/run.ts). Once a day, carry out
# the deletions people asked for in Settings whose 14-day waiting period is
# over and whose orders owe no buyer anything. One call does a bounded amount
# of work on one account and answers `"more":true` when there is more to do
# right now, so this calls again until it does not.
#
# STOREFRONT FUNNEL ROLLUP (src/lib/analytics/funnel/rollup.ts). Once a day,
# count the last finished days of buyer funnel events in Workers Analytics
# Engine (which keeps 90 days) and store them in Supabase. Each run redoes the
# last three days, so a missed night costs nothing. It answers
# `"configured":false` until the Worker has what it reads with (wrangler.jsonc,
# STOREFRONT FUNNEL), and that is not a failure.
#
# REVIEW REMINDERS (src/lib/reviews/reminder-job.ts). Once a day, send the
# one review reminder email each buyer who asked for it on their order page is
# due (about a week after the parcel ships), and let go the ones that can no
# longer be sent. Calls again while it answers `"more":true`.
#
# Required secret (the job is skipped, loudly, without it):
#   CRON_SECRET   A long random string (32 characters or more), set BOTH here
#                 as a repository secret and on the Worker
#                 (`wrangler secret put CRON_SECRET`). Until the Worker has it,
#                 the route answers 404 and nothing is ever deleted.
#
# What it prints is counts (deleted, held, failed), never an account id.
name: Scheduled jobs

on:
  schedule:
    # 03:23 UTC, off the hour.
    - cron: "23 3 * * *"
  workflow_dispatch: {}

concurrency:
  group: scheduled-jobs
  cancel-in-progress: false

permissions: {}

jobs:
  account-deletions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Job level so the steps' `if` can test it (see deploy.yml).
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      # The production dashboard (NEXT_PUBLIC_APP_URL in wrangler.jsonc).
      APP_URL: https://dashboard.squareshare.eu
    steps:
      - name: Say so when it is not set up
        if: ${{ env.CRON_SECRET == '' }}
        run: echo "::warning title=Account deletions did not run::Set the CRON_SECRET repository secret (and the same value on the Worker). Until then, deletion requests wait."

      - name: Carry out the account deletions that are due
        if: ${{ env.CRON_SECRET != '' }}
        run: |
          set -euo pipefail
          # Bounded: a run that keeps answering "more" for this long is stuck,
          # and tomorrow's run picks up where it stopped.
          for attempt in $(seq 1 40); do
            # --fail: a 404 (secret not on the Worker, or wrong) or a 500 turns
            # the job red instead of passing for "nothing to do".
            result="$(curl --fail --silent --show-error --max-time 60 \
              --request POST \
              --header "Authorization: Bearer ${CRON_SECRET}" \
              "${APP_URL}/api/cron/account-deletions")"
            echo "run ${attempt}: ${result}"
            if ! printf '%s' "${result}" | grep -q '"more":true'; then
              exit 0
            fi
          done
          echo "::warning title=Account deletions are not finishing::40 runs in a row still had more to do."

  # Emails everyone about a new Terms version, then starts its 30 days
  # (lib/legal/terms-notices.ts). Red means a notice could not go out: mail is
  # off, or the new version is not on the marketing site yet. The version stays
  # out of force until this goes green, so fix the cause rather than rerunning.
  terms-notices:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      APP_URL: https://dashboard.squareshare.eu
    steps:
      - name: Say so when it is not set up
        if: ${{ env.CRON_SECRET == '' }}
        run: echo "::warning title=Terms notices did not run::Set the CRON_SECRET repository secret."

      - name: Send the notices that are due
        if: ${{ env.CRON_SECRET != '' }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            result="$(curl --silent --show-error --max-time 60 --write-out '\n%{http_code}' \
              --request POST \
              --header "Authorization: Bearer ${CRON_SECRET}" \
              "${APP_URL}/api/cron/terms-notices")"
            body="$(printf '%s' "${result}" | sed '$d')"
            code="$(printf '%s' "${result}" | tail -n 1)"
            echo "run ${attempt}: ${code} ${body}"
            if [ "${code}" != "200" ]; then
              echo "::error title=Terms notices are blocked::${body}. New Terms stay out of force until this is fixed: see docs/changing-the-terms.md."
              exit 1
            fi
            if ! printf '%s' "${body}" | grep -q '"more":true'; then
              exit 0
            fi
          done
          echo "::warning title=Terms notices are not finishing::40 runs in a row still had more to send."

  # Sends the review reminders that have fallen due: the ONE email a buyer
  # asked for on their order page (src/lib/reviews/reminder-job.ts). Prints
  # counts only. `"configured":false` means mail is off, which is not a
  # failure: order pages offer no reminder then. Red means the queue could not
  # be read; a reminder that failed to send waits for tomorrow's run.
  review-reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      APP_URL: https://dashboard.squareshare.eu
    steps:
      - name: Say so when it is not set up
        if: ${{ env.CRON_SECRET == '' }}
        run: echo "::warning title=Review reminders did not run::Set the CRON_SECRET repository secret."

      - name: Send the review reminders that are due
        if: ${{ env.CRON_SECRET != '' }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            result="$(curl --fail --silent --show-error --max-time 120 \
              --request POST \
              --header "Authorization: Bearer ${CRON_SECRET}" \
              "${APP_URL}/api/cron/review-reminders")"
            echo "run ${attempt}: ${result}"
            if ! printf '%s' "${result}" | grep -q '"more":true'; then
              exit 0
            fi
          done
          echo "::warning title=Review reminders are not finishing::40 runs in a row still had more to send."

  agent-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      APP_URL: https://dashboard.squareshare.eu
    steps:
      - name: Say so when it is not set up
        if: ${{ env.CRON_SECRET == '' }}
        run: echo "::warning title=The agent cleanup did not run::Set the CRON_SECRET repository secret."

      - name: Drop expired agent tokens, old trail rows and unused app registrations
        if: ${{ env.CRON_SECRET != '' }}
        run: |
          set -euo pipefail
          # --fail: a 404 (secret not on the Worker, or wrong) or a 500 turns the
          # job red. Tomorrow's run takes up whatever is left.
          curl --fail --silent --show-error --max-time 120             --request POST             --header "Authorization: Bearer ${CRON_SECRET}"             "${APP_URL}/api/cron/agent-cleanup"

  funnel-rollup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      APP_URL: https://dashboard.squareshare.eu
    steps:
      - name: Say so when it is not set up
        if: ${{ env.CRON_SECRET == '' }}
        run: echo "::warning title=The funnel rollup did not run::Set the CRON_SECRET repository secret (and the same value on the Worker)."

      - name: Roll up the finished days of storefront funnel events
        if: ${{ env.CRON_SECRET != '' }}
        run: |
          set -euo pipefail
          # --fail: a 404 (secret not on the Worker, or wrong) or a 500 (a day
          # could not be rolled) turns the job red. Tomorrow's run redoes it.
          result="$(curl --fail --silent --show-error --max-time 120 \
            --request POST \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL}/api/cron/funnel-rollup")"
          echo "${result}"
