# Deploy the store dashboard to Cloudflare Workers (via OpenNext) on every
# push to main. This is the app's real target — it needs a server runtime for
# auth, Server Actions, and route handlers, so it can NOT run on GitHub Pages.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN         Token with "Edit Cloudflare Workers" permission
#   CLOUDFLARE_ACCOUNT_ID        Target Cloudflare account id
#   GH_PACKAGES_TOKEN            CLASSIC PAT with read:packages, required once
#                                @squaresharedev/* packages are dependencies
#                                (GitHub Packages rejects fine-grained tokens)
#
# Optional secrets (override the committed values):
#   NEXT_PUBLIC_SUPABASE_URL / NEXT_PUBLIC_SUPABASE_ANON_KEY
#
# Recommended secret (the schema gate below is skipped, loudly, without it):
#   SUPABASE_DB_URL              Postgres connection URI of a role that can log
#                                in and nothing else. `pnpm check:schema` reads
#                                pg_catalog only, so it needs no table grants.
#
# NEXT_PUBLIC_* values are baked into the client bundle at build time, so they
# must be present during the BUILD step, not just at deploy. They now come from
# the committed .env.production, so a missing secret can no longer white-screen
# production; the verify step below fails the run if they are absent anyway.
name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# One deploy at a time; a newer push supersedes an in-flight run.
concurrency:
  group: deploy-cloudflare
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The end-to-end gate (e2e.yml): checkout, the order lifecycle, the hosted
  # product page and deep-link sign-in, in a browser against the local stack.
  # The deploy waits for it, so a push that breaks one never ships.
  e2e:
    uses: ./.github/workflows/e2e.yml
    secrets: inherit

  deploy:
    needs: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Exposed at JOB level so the auth step's `if` can test it: the `secrets`
      # context is NOT available inside a step-level `if` expression, and using
      # it there makes the whole workflow file invalid. GitHub then records a
      # run named after the file path with zero jobs and conclusion "failure",
      # which is how every deploy since that line landed silently died.
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
      # Job level for the same reason: the schema gate's `if` tests it.
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Authenticate GitHub Packages registry
        if: ${{ env.GH_PACKAGES_TOKEN != '' }}
        run: pnpm config set "//npm.pkg.github.com/:_authToken" "$GH_PACKAGES_TOKEN"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Quality gates. Until these landed, a push to main went straight from
      # install to build to deploy: 566 Vitest tests and a typechecker existed
      # and none of them could stop a broken deploy.
      #
      # Kept as SEPARATE steps rather than one `pnpm test` so a red run names
      # the layer that failed. The DB suite is last because it is the only one
      # that boots a real Postgres (embedded-postgres, no Docker), so it is the
      # slowest and the likeliest to fail for environmental reasons rather than
      # because the code is wrong.
      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit and component tests
        run: pnpm test:unit

      # Until 2026-10-21 the database suite never ran here: the embedded
      # Postgres could not start without ICU 60 ("libicuuc.so.60"), vitest
      # found no tests, and the step still passed. With ICU installed, 521
      # tests run.
      - name: Install ICU 60 for the embedded Postgres
        run: bash scripts/ci-install-icu60.sh

      - name: Database integration tests
        run: pnpm test:db

      # THE SCHEMA GATE. Migrations are applied to production by hand, and the
      # app selects new columns on every order read, so a build that deploys
      # ahead of its migration takes the Orders page and every buyer order
      # page down with it. This asks production whether it has what this
      # build needs (scripts/lib/prod-schema.ts) and refuses to deploy when it
      # does not, naming the migration to apply.
      #
      # Without the secret it cannot ask, and says so as a warning rather than
      # failing: a gate that blocks every deploy until someone adds a secret
      # gets deleted, not configured.
      - name: Check production has this build's schema
        if: ${{ env.SUPABASE_DB_URL != '' }}
        run: pnpm check:schema

      - name: Warn that the schema gate did not run
        if: ${{ env.SUPABASE_DB_URL == '' }}
        run: |
          echo "::warning::SUPABASE_DB_URL is not set, so this deploy was NOT checked against production's schema. Run 'pnpm check:schema' locally before pushing a migration-dependent change, and add the secret (see the top of this file)."

      - name: Build
        run: npx opennextjs-cloudflare build
        env:
          # Optional overrides. The committed .env.production supplies these,
          # so an unset secret is no longer fatal — but process.env still wins
          # if a secret IS set, which is the escape hatch for a rotated key.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      # NEXT_PUBLIC_* are INLINED into the browser bundle by `next build`. A
      # build that ran without them produces JavaScript no runtime var can
      # rescue: createClient() throws "Supabase credentials missing" and every
      # page dies at the error boundary. That shipped to production once,
      # because the build step only echoed a warning and deployed anyway.
      # Assert against the built artifact rather than the environment — the
      # artifact is what users download, and it is the only thing that proves
      # the inlining actually happened.
      - name: Verify the client bundle carries the Supabase config
        run: |
          set -euo pipefail
          if ! grep -rqF "supabase.co" .open-next/assets/_next/static; then
            echo "::error::Client bundle has no Supabase URL inlined. next build ran without NEXT_PUBLIC_SUPABASE_URL / NEXT_PUBLIC_SUPABASE_ANON_KEY (check .env.production and the repo secrets). Refusing to deploy a bundle that would white-screen."
            exit 1
          fi
          echo "Supabase config present in the client bundle."

      # STAGED DEPLOY. The build is uploaded as a VERSION that serves nobody,
      # put beside the live version at 0%, and smoke-checked on the real
      # hostname through Cloudflare's version-override header
      # (scripts/smoke-check.sh --version). Only a version that passes is
      # promoted to 100%, so a build that boots but answers 500 everywhere
      # (2026-09-24) never reaches a user. If the check fails, the 0% version
      # is taken back out, and production never changed.
      #
      # `wrangler versions` does not apply routes or cron triggers the way
      # `wrangler deploy` did, so they are applied after the promotion.
      - name: Upload the new version (it serves no traffic yet)
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          LIVE=$(npx wrangler deployments status --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const v=JSON.parse(s).versions.sort((a,b)=>b.percentage-a.percentage);console.log(v[0].version_id)})')
          export WRANGLER_OUTPUT_FILE_PATH="$RUNNER_TEMP/wrangler-upload.ndjson"
          npx wrangler versions upload --message "${GITHUB_SHA::7}" | tee "$RUNNER_TEMP/upload.log"
          NEW=$(node -e 'const fs=require("fs");const rows=fs.readFileSync(process.argv[1],"utf8").trim().split("\n").map(l=>JSON.parse(l));const up=rows.find(r=>r.type==="version-upload");if(!up||!up.version_id)process.exit(1);console.log(up.version_id)' "$WRANGLER_OUTPUT_FILE_PATH" \
            || grep -oE 'Worker Version ID: [0-9a-f-]{36}' "$RUNNER_TEMP/upload.log" | grep -oE '[0-9a-f-]{36}')
          echo "live=$LIVE" >> "$GITHUB_OUTPUT"
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          echo "Live: $LIVE  New: $NEW"

      - name: Put the new version beside the live one at 0%
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler versions deploy "${{ steps.upload.outputs.live }}@100%" "${{ steps.upload.outputs.new }}@0%" --yes --message "check ${GITHUB_SHA::7}"

      - name: Smoke check the new version before anyone gets it
        run: bash scripts/smoke-check.sh --version "${{ steps.upload.outputs.new }}" --build-id "$(cat .next/BUILD_ID)"

      - name: Promote the new version to all traffic
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler versions deploy "${{ steps.upload.outputs.new }}@100%" --yes --message "${GITHUB_SHA::7}"
          npx wrangler triggers deploy

      # The same checks against production, now that it is live. A failure here
      # rolls production back to the version that was live before this run.
      - name: Smoke check production
        run: bash scripts/smoke-check.sh

      - name: Take a failed version back out
        if: ${{ failure() && steps.upload.outputs.live != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler versions deploy "${{ steps.upload.outputs.live }}@100%" --yes --message "back out ${GITHUB_SHA::7}"
