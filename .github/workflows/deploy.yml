# Deploy the store dashboard to Cloudflare Workers (via OpenNext) on every
# push to main. This is the app's real target — it needs a server runtime for
# auth, Server Actions, and route handlers, so it can NOT run on GitHub Pages.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN         Token with "Edit Cloudflare Workers" permission
#   CLOUDFLARE_ACCOUNT_ID        Target Cloudflare account id
#   NEXT_PUBLIC_SUPABASE_URL     Supabase project URL (public, inlined at build)
#   NEXT_PUBLIC_SUPABASE_ANON_KEY  Supabase publishable/anon key (public)
#   GH_PACKAGES_TOKEN            CLASSIC PAT with read:packages, required once
#                                @squaresharedev/* packages are dependencies
#                                (GitHub Packages rejects fine-grained tokens)
#
# NEXT_PUBLIC_* values are baked into the client bundle at build time, so they
# must be present during the build step, not just at deploy.
name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# One deploy at a time; a newer push supersedes an in-flight run.
concurrency:
  group: deploy-cloudflare
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Exposed at JOB level so the auth step's `if` can test it: the `secrets`
      # context is NOT available inside a step-level `if` expression, and using
      # it there makes the whole workflow file invalid. GitHub then records a
      # run named after the file path with zero jobs and conclusion "failure",
      # which is how every deploy since that line landed silently died.
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Authenticate GitHub Packages registry
        if: ${{ env.GH_PACKAGES_TOKEN != '' }}
        run: pnpm config set "//npm.pkg.github.com/:_authToken" "$GH_PACKAGES_TOKEN"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and deploy
        run: |
          echo "SUPABASE_URL present: ${NEXT_PUBLIC_SUPABASE_URL:+yes}${NEXT_PUBLIC_SUPABASE_URL:-NO}"
          echo "ANON_KEY present: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:+yes}${NEXT_PUBLIC_SUPABASE_ANON_KEY:-NO}"
          npx opennextjs-cloudflare build
          pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
